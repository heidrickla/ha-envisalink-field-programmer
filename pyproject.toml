[project]
name = "ha-envisalink-field-programmer"
version = "0.4.2"
description = "Home Assistant integration for guided Vista field programming over an Envisalink."
# The source uses PEP 758 unparenthesised `except` tuples, which need 3.14.
# Home Assistant 2026.3.0, the oldest release hacs.json admits, itself declares
# requires-python >=3.14.2, so no install this integration admits is below it.
requires-python = ">=3.14.2"

[tool.ruff]
# CI installs 3.14 and the mypy block below pins python_version 3.14.
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# pytest-asyncio 0.24+ warns until the fixture loop scope is stated.
asyncio_default_fixture_loop_scope = "function"
# tests/winposix.py supplies the POSIX modules the harness imports at plugin
# load, which is earlier than any conftest runs. It is a no-op off Windows.
addopts = "-p tests.winposix"

# strict-typing is the Platinum rule with teeth: Home Assistant runs mypy in
# strict mode over integrations that claim it. It is only meaningful with Home
# Assistant installed; without it every HA class is Any and the check is weaker
# than it looks, which is why CI runs it inside the harness venv.
#
# Home Assistant core's generated mypy.ini [mypy] block (2026.8.3), plus
# `strict`, which covers the flags core lists individually. Dropped from core's
# block: plugins, native_parser and num_workers (core-tree settings), and
# warn_incomplete_stub (core type-checks its own stubs).
[tool.mypy]
python_version = "3.14"
platform = "linux"
strict = true
local_partial_types = true
no_implicit_optional = true
strict_bytes = true
warn_unreachable = true
extra_checks = false
enable_error_code = [
    "deprecated",
    "explicit-override",
    "ignore-without-code",
    "redundant-self",
    "truthy-iterable",
]
disable_error_code = ["annotation-unchecked", "import-not-found", "import-untyped"]
follow_imports = "normal"
show_error_codes = true

# The tests are not the integration; CI checks custom_components/<domain> and
# never reaches here. `strict = false` does not belong in this section: mypy
# 1.18.2 accepts it without a warning and discards the whole section.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
disallow_any_generics = false
warn_return_any = false

[project]
name = "ha-envisalink-field-programmer"
version = "0.3.1"
description = "Home Assistant integration for guided Vista field programming over an Envisalink."
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# pytest-asyncio 0.24+ warns until the fixture loop scope is stated.
asyncio_default_fixture_loop_scope = "function"

# strict-typing is the Platinum rule with teeth: Home Assistant runs mypy in
# strict mode over integrations that claim it. This mirrors the strict block
# core applies. It is only meaningful with Home Assistant installed; without
# it every HA class is Any and the check is weaker than it looks, which is why
# CI runs it inside the harness venv.
#
# No python_version pin: Home Assistant only runs on the interpreter it was
# built for, and its 2026.x source uses 3.14 syntax, so mypy must target the
# interpreter it is installed under rather than the 3.12 floor.
[tool.mypy]
strict = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
ignore_missing_imports = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disallow_untyped_defs = false

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Other CI systems also pick up .github/workflows, so the job is gated to
# GitHub by github.server_url.

jobs:
  python-tests:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Home Assistant 2026.x needs Python 3.14.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # 0.13.357 pins Home Assistant 2026.8.3 and brings pytest, pytest-cov,
      # its asyncio and aiohttp plugins and PyYAML with it (pinning any of
      # those again makes the resolution impossible). Only the tools the
      # harness does not carry are pinned here. uv installs the same packages
      # as pip did (compared 2026-10-30) in a quarter of the time; 0.11.31 is
      # the uv the harness itself pins.
      - name: Install the Home Assistant test harness (pinned)
        run: |
          python -m pip install "uv==0.11.31"
          python -m uv pip install --system "mypy==1.18.2" "ruff==0.15.21" \
            "pytest-homeassistant-custom-component==0.13.357"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      # The pure suite is the client, models, state machine and keystroke
      # builders, loaded by path; it must pass with the harness plugin off.
      # It measures coverage but reports none: the two suites cover the same
      # package from opposite sides, so the second run appends to this one
      # and the gate is applied once, to the total.
      - name: Pure tests
        run: >-
          python -m pytest tests -q --ignore=tests/ha -p no:homeassistant
          --cov=custom_components/envisalink_field_programmer
          --cov-report=
      - name: Home Assistant layer tests
        run: >-
          python -m pytest tests/ha -q
          --cov=custom_components/envisalink_field_programmer
          --cov-append
          --cov-report=term-missing
          --cov-fail-under=95
      # strict-typing only means something with Home Assistant installed,
      # which is the case here and not on a bare workstation.
      - name: mypy --strict
        run: python -m mypy custom_components/envisalink_field_programmer
      - name: Offline validator
        run: python tools/validate_local.py

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio pytest-homeassistant-custom-component ruff
      - name: Ruff lint
        run: ruff check custom_components tests
      - name: Run tests
        run: pytest tests -v

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www/envisalink-field-programmer-card
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Fail if built card is out of date
        run: git diff --exit-code -- ../../custom_components/envisalink_field_programmer/www/envisalink-field-programmer-card.js

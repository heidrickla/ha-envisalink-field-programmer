name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Lint, both test suites, mypy and the offline validator run in tests.yml.
# This workflow is the official validators plus the card build.

jobs:
  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: www/envisalink-field-programmer-card
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Fail if built card is out of date
        run: git diff --exit-code -- ../../custom_components/envisalink_field_programmer/www/envisalink-field-programmer-card.js

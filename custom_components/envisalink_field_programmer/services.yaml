send_keystrokes:
  name: Send keystrokes
  description: >-
    Send a raw ECP keystroke string to a partition, as if typed on a keypad.
    Refused if the sequence looks like it opens installer Program Mode
    (installer code followed by 800) unless confirm_installer_risk is set to
    true. Prefer program_zone / set_system_timing / program_function_key for
    guided, validated field programming -- this service is for anything they
    don't cover. Read the integration's README safety section first.
  fields:
    entry_id:
      name: Config entry
      description: The Envisalink Field Programmer config entry to send this to.
      required: true
      selector:
        config_entry:
          integration: envisalink_field_programmer
    partition:
      name: Partition
      description: Partition number (1-8).
      required: true
      selector:
        number:
          min: 1
          max: 8
          mode: box
    keys:
      name: Keys
      description: Keystrokes to send (digits, * and # only).
      required: true
      selector:
        text:
    confirm_installer_risk:
      name: Confirm installer risk
      description: >-
        Must be true to send a sequence that opens Program Mode. Only set
        this if you understand the panel can lock out until power-cycled,
        that Program Mode governs fire-zone and UL-listing-relevant
        settings, and that the TPI protocol can't confirm what's actually on
        the keypad display.
      required: false
      default: false
      selector:
        boolean:

program_zone:
  name: Program zone
  description: >-
    Guided zone programming (equivalent to *56 menu mode): set a zone's
    type, partition, reporting, and wiring settings. Always opens Program
    Mode, so an installer code must be configured in this integration's
    options, and confirm must be true. This cannot read back a zone's
    current programming first -- double check at the physical keypad
    (installer code + # + 56) if you're unsure what's there now.
  fields:
    entry_id:
      name: Config entry
      description: The Envisalink Field Programmer config entry that owns this zone.
      required: true
      selector:
        config_entry:
          integration: envisalink_field_programmer
    zone_number:
      name: Zone number
      description: Zone number (1-64).
      required: true
      selector:
        number:
          min: 1
          max: 64
          mode: box
    zone_type:
      name: Zone type
      description: >-
        Vista zone type code (see the integration's field_programming.py
        ZONE_TYPES table for the plain-language meaning of each, e.g. 3 =
        Perimeter, 9 = Fire).
      required: true
      selector:
        number:
          min: 0
          max: 24
          mode: box
    partition:
      name: Partition
      description: Partition number (1-3).
      required: true
      selector:
        number:
          min: 1
          max: 3
          mode: box
    report_enabled:
      name: Report to monitoring station
      description: Whether faults/alarms on this zone are reported.
      required: false
      default: true
      selector:
        boolean:
    hardwire_type:
      name: Hardwire type
      description: >-
        Wiring style for zones 2-8 (ignored for zone 1, which is always
        end-of-line, and for zones 9+). 0=EOL, 1=NC, 2=NO, 3=zone doubling,
        4=double-balanced.
      required: false
      default: "0"
      selector:
        select:
          options: ["0", "1", "2", "3", "4"]
    response_time:
      name: Response time
      description: >-
        For zones 1-8 only. 0=10ms, 1=350ms, 2=700ms, 3=1.2sec.
      required: false
      default: "1"
      selector:
        select:
          options: ["0", "1", "2", "3"]
    confirm:
      name: Confirm
      description: Must be true. This always opens Program Mode.
      required: true
      selector:
        boolean:
    confirm_life_safety:
      name: Confirm life-safety change
      description: >-
        Must be true if zone_type is a fire or carbon-monoxide type (9, 14,
        16). Extra confirmation because getting this wrong on a real smoke
        or CO detector's zone silences it.
      required: false
      default: false
      selector:
        boolean:
    confirm_unverified_model:
      name: Confirm unverified panel model
      description: >-
        Must be true if this config entry's panel model is anything other than
        the VISTA-21iP. Every other model's field numbers/zone-type codes are
        inherited or provisional and not verified against that panel's own
        programming guide -- acknowledge that and verify the result at the
        keypad.
      required: false
      default: false
      selector:
        boolean:

set_system_timing:
  name: Set system timing
  description: >-
    Guided edit of a single numbered timing/behavior data field (exit
    delay, entry delay 1/2, auto-stay-arm). Always opens Program Mode, so an
    installer code must be configured and confirm must be true.
  fields:
    entry_id:
      name: Config entry
      description: The Envisalink Field Programmer config entry to program.
      required: true
      selector:
        config_entry:
          integration: envisalink_field_programmer
    field:
      name: Field
      description: Which timing field to set.
      required: true
      selector:
        select:
          options: ["34", "35", "36", "84"]
    value:
      name: Value
      description: >-
        New value. Exit delay (34) and entry delays (35/36): seconds
        (0-96), or the field's special extended-time codes (see the
        integration's SYSTEM_TIMING_DESCRIPTIONS). Auto-stay-arm (84): 0-3.
      required: true
      selector:
        number:
          min: 0
          max: 240
          mode: box
    confirm:
      name: Confirm
      description: Must be true. This always opens Program Mode.
      required: true
      selector:
        boolean:
    confirm_unverified_model:
      name: Confirm unverified panel model
      description: >-
        Must be true for any panel model other than the VISTA-21iP (field
        numbers are inherited/provisional for the rest). Verify at the keypad.
      required: false
      default: false
      selector:
        boolean:

program_function_key:
  name: Program function key
  description: >-
    Guided assignment of one of the keypad's A/B/C/D function keys (*57
    menu mode). Always opens Program Mode, so an installer code must be
    configured and confirm must be true.
  fields:
    entry_id:
      name: Config entry
      description: The Envisalink Field Programmer config entry to program.
      required: true
      selector:
        config_entry:
          integration: envisalink_field_programmer
    key:
      name: Key
      description: Which function key to assign.
      required: true
      selector:
        select:
          options: ["A", "B", "C", "D"]
    partition:
      name: Partition
      description: Partition number (1-3) this key will act on.
      required: true
      selector:
        number:
          min: 1
          max: 3
          mode: box
    action:
      name: Action
      description: >-
        0=default emergency, 1=paging, 2=display time, 3=Arm Away, 4=Arm
        Stay, 5=Arm Night-Stay, 6=step-arm, 7=output/relay trigger,
        8=communication test.
      required: true
      selector:
        number:
          min: 0
          max: 8
          mode: box
    confirm:
      name: Confirm
      description: Must be true. This always opens Program Mode.
      required: true
      selector:
        boolean:
    confirm_unverified_model:
      name: Confirm unverified panel model
      description: >-
        Must be true for any panel model other than the VISTA-21iP (field
        numbers are inherited/provisional for the rest). Verify at the keypad.
      required: false
      default: false
      selector:
        boolean:

toggle_zone_bypass:
  name: Toggle zone bypass
  description: Bypass or un-bypass a single zone using the standard *1zz# sequence.
  fields:
    entry_id:
      name: Config entry
      description: The Envisalink Field Programmer config entry that owns this zone.
      required: true
      selector:
        config_entry:
          integration: envisalink_field_programmer
    zone:
      name: Zone
      description: Zone number (1-64).
      required: true
      selector:
        number:
          min: 1
          max: 64
          mode: box

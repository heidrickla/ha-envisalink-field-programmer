send_keystrokes:
  name: Send keystrokes
  description: >-
    Send a raw ECP keystroke string to a partition, as if typed on a keypad.
    Refused if the sequence looks like it opens installer Program Mode
    (installer code followed by 800) unless confirm_installer_risk is set to
    true. Prefer program_zone / set_system_timing / program_function_key for
    guided, validated field programming -- this service is for anything they
    don't cover. Read the integration's README safety section first.
  fields:
    entry_id:
      name: Config entry
      description: The Envisalink Field Programmer config entry to send this to.
      required: true
      selector:
        config_entry:
          integration: envisalink_field_programmer
    partition:
      name: Partition
      description: Partition number (1-8).
      required: true
      selector:
        number:
          min: 1
          max: 8
          mode: box
    keys:
      name: Keys
      description: Keystrokes to send (digits, * and # only).
      required: true
      selector:
        text:
    confirm_installer_risk:
      name: Confirm installer risk
      description: >-
        Must be true to send a sequence that opens Program Mode. Only set
        this if you understand the panel can lock out until power-cycled,
        that Program Mode governs fire-zone and UL-listing-relevant
        settings, and that the TPI protocol can't confirm what's actually on
        the keypad display.
      required: false
      default: false
      selector:
        boolean:

program_zone:
  name: Program zone
  description: >-
    Guided zone programming (equivalent to *56 menu mode): set a zone's
    type, partition, reporting, and wiring settings. Always opens Program
    Mode, so an installer code must be configured in this integration's
    options, and confirm must be true. Writes board zones, doubled zones and
    zones on a wired zone expander; wireless zones and buttons are
    programmed at the keypad. On a VISTA-21iP or 20P, zones 9-16 need Zone
    doubling stated in the options. This cannot read back a zone's current
    programming first -- check it at the physical keypad (in Program Mode,
    *58 then the zone number shows it; # backs out without saving).
  fields:
    entry_id:
      name: Config entry
      description: The Envisalink Field Programmer config entry that owns this zone.
      required: true
      selector:
        config_entry:
          integration: envisalink_field_programmer
    zone_number:
      name: Zone number
      description: Zone number (1-64).
      required: true
      selector:
        number:
          min: 1
          max: 64
          mode: box
    zone_type:
      name: Zone type
      description: >-
        Vista zone type code (see the integration's field_programming.py
        ZONE_TYPES table for the plain-language meaning of each, e.g. 3 =
        Perimeter, 9 = Fire).
      required: true
      selector:
        number:
          min: 0
          max: 24
          mode: box
    partition:
      name: Partition
      description: Partition number (1-3).
      required: true
      selector:
        number:
          min: 1
          max: 3
          mode: box
    report_enabled:
      name: Report to monitoring station
      description: Whether faults/alarms on this zone are reported.
      required: false
      default: true
      selector:
        boolean:
    hardwire_type:
      name: Hardwire type
      description: >-
        Wiring style for the board zones whose menu asks it (zones 2-8; 2-6
        on the 15P; 1-6 on the 10P), ignored for other zones. 0=EOL, 1=NC,
        2=NO, 3=zone doubling (21iP/20P, with Zone doubling on in the
        options), 4=double-balanced (21iP/20P).
      required: false
      default: "0"
      selector:
        select:
          options: ["0", "1", "2", "3", "4"]
    response_time:
      name: Response time
      description: >-
        For board zones only. 0=10ms, 1=350ms, 2=700ms, 3=1.2sec.
      required: false
      default: "1"
      selector:
        select:
          options: ["0", "1", "2", "3"]
    zone_connection:
      name: Zone connection
      description: >-
        How an expansion zone (9 and up, not a doubled zone) is connected
        now: wired_expander for a 4219/4229 zone expander, or wireless. The
        panel asks different questions for each, so it is required for those
        zones, and wireless is refused.
      required: false
      selector:
        select:
          options: ["wired_expander", "wireless"]
    confirm:
      name: Confirm
      description: Must be true. This always opens Program Mode.
      required: true
      selector:
        boolean:
    confirm_life_safety:
      name: Confirm life-safety change
      description: >-
        Must be true if zone_type is a fire or carbon-monoxide type (9, 14,
        16). Extra confirmation because getting this wrong on a real smoke
        or CO detector's zone silences it.
      required: false
      default: false
      selector:
        boolean:
    confirm_unverified_model:
      name: Confirm unverified panel model
      description: >-
        Must be true if this config entry's panel model is not verified
        against its own programming guide (the commercial VISTA and DSC
        models). Acknowledge that and verify the result at the keypad.
      required: false
      default: false
      selector:
        boolean:

set_system_timing:
  name: Set system timing
  description: >-
    Guided edit of a single timing data field. Valid field numbers and value
    encodings depend on the panel model: residential VISTA uses 34 (exit
    delay), 35/36 (entry delay 1/2) in seconds and 84 (auto-stay 0-3);
    commercial VISTA-128BP/250BP use 09-12 (entry/exit delay 1/2) in units of
    15 seconds (0, or 2-15), which are partition-specific. Always opens Program
    Mode, so an installer code must be configured and confirm must be true.
  fields:
    entry_id:
      name: Config entry
      description: The Envisalink Field Programmer config entry to program.
      required: true
      selector:
        config_entry:
          integration: envisalink_field_programmer
    field:
      name: Field
      description: >-
        Timing field id for this panel. Residential VISTA: 34/35/36/84.
        Commercial VISTA (128BP/250BP): 09/10/11/12. An invalid id for the
        selected model is refused.
      required: true
      selector:
        text:
    value:
      name: Value
      description: >-
        New value. Residential exit/entry delays (34/35/36): seconds (0-96)
        or the field's extended-time codes; auto-stay (84): 0-3. Commercial
        (09-12): units of 15 seconds, 0 or 2-15 (e.g. 4 = 60 seconds).
      required: true
      selector:
        number:
          min: 0
          max: 240
          mode: box
    partition:
      name: Partition
      description: >-
        Partition to program (1-8). Only used by panels with partition-specific
        timing fields (commercial VISTA 09-12); ignored for residential.
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 8
          mode: box
    confirm:
      name: Confirm
      description: Must be true. This always opens Program Mode.
      required: true
      selector:
        boolean:
    confirm_unverified_model:
      name: Confirm unverified panel model
      description: >-
        Must be true if this config entry's panel model is not verified
        against its own programming guide (the commercial VISTA and DSC
        models). Verify at the keypad.
      required: false
      default: false
      selector:
        boolean:

program_function_key:
  name: Program function key
  description: >-
    Guided assignment of one of the keypad's A/B/C/D function keys (*57
    menu mode). Always opens Program Mode, so an installer code must be
    configured and confirm must be true.
  fields:
    entry_id:
      name: Config entry
      description: The Envisalink Field Programmer config entry to program.
      required: true
      selector:
        config_entry:
          integration: envisalink_field_programmer
    key:
      name: Key
      description: Which function key to assign.
      required: true
      selector:
        select:
          options: ["A", "B", "C", "D"]
    partition:
      name: Partition
      description: Partition number (1-3) this key will act on.
      required: true
      selector:
        number:
          min: 1
          max: 3
          mode: box
    action:
      name: Action
      description: >-
        0=default emergency, 1=paging, 2=display time, 3=Arm Away, 4=Arm
        Stay, 5=Arm Night-Stay, 6=step-arm, 7=output/relay trigger,
        8=communication test.
      required: true
      selector:
        number:
          min: 0
          max: 8
          mode: box
    confirm:
      name: Confirm
      description: Must be true. This always opens Program Mode.
      required: true
      selector:
        boolean:
    confirm_unverified_model:
      name: Confirm unverified panel model
      description: >-
        Must be true if this config entry's panel model is not verified
        against its own programming guide (the commercial VISTA and DSC
        models). Verify at the keypad.
      required: false
      default: false
      selector:
        boolean:

toggle_zone_bypass:
  name: Toggle zone bypass
  description: Bypass or un-bypass a single zone using the standard *1zz# sequence.
  fields:
    entry_id:
      name: Config entry
      description: The Envisalink Field Programmer config entry that owns this zone.
      required: true
      selector:
        config_entry:
          integration: envisalink_field_programmer
    zone:
      name: Zone
      description: Zone number (1-64).
      required: true
      selector:
        number:
          min: 1
          max: 64
          mode: box

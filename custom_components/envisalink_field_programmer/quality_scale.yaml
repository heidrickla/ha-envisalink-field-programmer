rules:
  # Bronze
  action-setup:
    status: done
    comment: |
      The five actions are registered in async_setup, not per entry, so a
      call while the entry is unloaded gets a translated refusal.
  appropriate-polling:
    status: done
    comment: |
      Push-driven (local_push) over a long-lived TCP session. Two timers
      remain because the protocol offers nothing better: a keepalive poll
      (30 s by default, adjustable 10 to 300 s) to detect a silently dead
      connection, and a zone timer dump request every 30 s, the only source
      of zone open/closed state a Honeywell panel gives over TPI.
  brands:
    status: done
    comment: |
      The rule asks for branding assets that make the integration
      recognisable, and points at the home-assistant/brands README for what
      those assets are. That README no longer asks a custom integration for a
      pull request: it calls its custom_integrations folder Legacy and says
      "Since HA 2026.3.0, custom components can include their brand icons
      directly" (read 2026-09-05). Home Assistant 2026.3 and later serves
      brand/ out of the integration itself: homeassistant/components/brands
      resolves an image through _serve_from_custom_integration when
      Integration.has_branding is true, which is a brand directory beside
      manifest.json. Read out of the installed 2026.8.3 wheel to confirm the
      lookup and the fallback chain.

      All four images ship at
      custom_components/envisalink_field_programmer/brand/: icon.png 256x256
      and icon@2x.png 512x512 as the README requires, and a real landscape
      logo, the icon art beside the name set in the icon's own teal, at
      504x160 and 1008x320, whose shortest sides are inside the 128-256 and
      256-512 the README allows. The logos are their own image, not the
      copy of the icon that used to sit here. tools/validate_local.py
      measures every one of those sizes from the PNG header and fails a logo
      whose bytes equal an icon's, so the pair cannot silently drift back.
      hacs.json asks for 2026.3.0 for this reason, and the README says why.
  common-modules: done
  config-flow-test-coverage:
    status: done
    comment: |
      tests/ha/test_config_flow.py covers the user step, every error
      (invalid_auth, cannot_connect, unknown, too_many_zones,
      too_many_partitions) followed by recovery to CREATE_ENTRY, both
      already_configured aborts, reauth in both outcomes, the options flow,
      all four DHCP outcomes and reconfigure in five. Run against a fake TPI
      server, not a mocked connection. The rule wants the whole file, so the
      measurement is the check: 137 statements, 0 missed, 100%, on the green
      Tests run for f7ac510 (2026-09-05). It was 99% until that commit, one
      statement short: a named no-op event callback in the throwaway probe
      client whose body nothing ever ran.
  config-flow:
    status: done
    comment: |
      Every field has a data_description; the password and both codes use a
      password selector and are never sent back to the browser.
  dependency-transparency:
    status: done
    comment: |
      No external dependency. requirements is empty; the TPI client is
      asyncio streams plus the standard library.
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: This integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: This integration provides no triggers.
  entity-event-setup:
    status: done
    comment: |
      Entities are coordinator-driven; CoordinatorEntity subscribes in
      async_added_to_hass and unsubscribes on removal.
  entity-unique-id: done
  has-entity-name: done
  runtime-data:
    status: done
    comment: The coordinator lives on entry.runtime_data, typed VistaConsoleConfigEntry.
  test-before-configure:
    status: done
    comment: |
      The flow completes the TPI login handshake against the Envisalink and
      disconnects before creating the entry, so a wrong password or a busy
      or unreachable port is caught on the form.
  test-before-setup:
    status: done
    comment: |
      A rejected password raises ConfigEntryAuthFailed; every other client
      error (connection, protocol, command) and OSError raises
      ConfigEntryNotReady. Both carry translation keys. A failure after
      login closes the socket, since the Envisalink admits one TPI client.
  unique-config-entry:
    status: done
    comment: |
      host:port is the unique id and an entries match on host and port
      aborts before the connection is tried. The Envisalink exposes no
      serial over TPI.

  # Silver
  action-exceptions:
    status: done
    comment: |
      Input and reference errors (unknown or unloaded entry, missing
      installer code, unsupported guided operation, invalid timing field or
      value, every keystroke-guard refusal, arming without a code) raise
      ServiceValidationError; a refused or unacknowledged command raises
      HomeAssistantError. KeystrokeGuardError is a ServiceValidationError
      subclass, so the guided refusals are validation errors too;
      tests/ha/test_field_programming_services.py asserts the class and the
      translation key of each.
  config-entry-unloading:
    status: done
    comment: |
      Unload stops the platforms and shuts the coordinator down, which
      cancels its keepalive and reconnect tasks (created as the entry's
      background tasks) and closes the socket.
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable:
    status: done
    comment: Every entity is unavailable while the TPI session is down.
  integration-owner: done
  log-when-unavailable:
    status: done
    comment: |
      One info line when the session is lost, one when it is back; the
      reconnect attempts in between log at debug.
  parallel-updates:
    status: done
    comment: |
      The rule page allows 0 only for a read-only platform behind a
      coordinator, because "a coordinator only centralizes the inbound data
      updates; it does not limit outbound action" calls, and asks a platform
      that carries actions for a real limit, normally 1 (read 2026-09-05).
      So: 0 on sensor and binary_sensor, which only read what the coordinator
      pushes. 1 on switch and alarm_control_panel: a bypass toggle and every
      arm or disarm sends a keystroke sequence to a panel that takes one
      command at a time, and the client's lock is held per TPI frame rather
      than per sequence, so without the semaphore two concurrent calls would
      interleave their keypresses at a live alarm panel.
  reauthentication-flow:
    status: done
    comment: |
      ConfigEntryAuthFailed at setup starts reauth_confirm, which asks for
      the Envisalink password only and tests it before storing it.
  test-coverage:
    status: done
    comment: |
      The Tests workflow measures both suites into one report, the pure one
      appending into the Home Assistant one, and fails under 95%. Measured
      99% on 2026-09-04 (13 of 1452 statements missed): defensive branches
      in the panel dialects, one unreachable-looking guard each in the
      client, the sensor and the zone timer decoder, and the debug log for
      a zone timer dump that fails right after a reconnect.

  # Gold
  devices:
    status: done
    comment: |
      One device per entry, the panel behind the Envisalink, with the
      module's own web page as its configuration URL and, once a DHCP
      discovery has learned it, its MAC as a network connection.
  diagnostics:
    status: done
    comment: |
      A live state snapshot with the password and both codes redacted;
      tests/ha/test_integration_setup.py checks the redaction.
  discovery:
    status: done
    comment: |
      DHCP, on the MAC prefix 00:1C:2A. That block is registered to Envisacor
      Technologies Inc. of Concord, Ontario, who make the Envisalink; checked
      2026-09-04 against the IEEE registry through two independent lookups.
      The company's other block is an IAB (00:50:C2:49:C), which only one
      lookup confirmed, so it is deliberately not matched. A discovered unit
      opens the normal form with the address filled in, since the Envisalink
      password still has to be typed.
  discovery-update-info:
    status: done
    comment: |
      The MAC learned at discovery is stored with the entry, and an entry
      added by hand at an address that later appears in a lease adopts it
      too. A lease for a stored MAC at a different address moves that entry:
      host, unique id and title are updated and the entry reloads. TPI itself
      reports no identity, so this is the only way a move is distinguished
      from a second Envisalink.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: |
      One entry is one panel. Zones and partitions are entities on that
      device, fixed by the counts given at setup, and the protocol reports no
      hardware coming or going, so there is no device to add later. The rule
      page lists no exceptions; core files the per-device case this way all
      the same (see androidtv_remote's quality_scale.yaml, "configured on a
      per-device basis, so there are no dynamic devices to add").
  entity-category:
    status: done
    comment: |
      Last Event, Last User and System Trouble are DIAGNOSTIC: each reports
      the panel's own health or protocol traffic rather than the security
      state. The alarm control panels, zone sensors and bypass switches are
      primary entities and take the default category.
  entity-device-class:
    status: done
    comment: |
      Zones are OPENING, System Trouble is PROBLEM, bypass switches are
      SWITCH. Alarm control panels have no device class; the diagnostic
      text sensors have none that fits.
  entity-disabled-by-default:
    status: done
    comment: |
      Zone bypass switches and the Last Event sensor are disabled by default:
      the switches write keystrokes to the panel, and Last Event changes on
      every keepalive acknowledgement, a state write every 30 seconds for a
      value only useful while debugging the protocol. The Lovelace card reads
      neither, so nothing breaks when they are off.
  entity-translations:
    status: done
    comment: |
      Every entity name comes from a translation key with an entity section
      in strings.json; the numbered ones carry the partition or zone number
      as a placeholder. The one exception is a zone the user has named in the
      options, which is their own text and is shown as typed. The offline
      validator fails a key the strings do not declare and a declared key no
      entity uses.
  exception-translations:
    status: done
    comment: |
      Every HomeAssistantError this integration raises carries a translation
      key: the setup exceptions, the no-code error, the three keystroke-guard
      refusals, the device refusal from the guarded sender and all six
      guided-programming refusals. The offline validator reads the setup,
      coordinator, service and platform modules from their syntax trees and
      fails any raise of one of those classes that names no translation key,
      a key the strings do not declare, and a declared key nothing raises.
      Checked 2026-09-04 with a positive control in each direction: an
      untranslated raise inserted into coordinator.py, and one inserted into
      field_programming_services.py, each failed the run.
  icon-translations:
    status: done
    comment: |
      icons.json gives the five actions an icon each and covers the two
      diagnostic text sensors, which have no device class to supply one. The
      zone sensors (OPENING), System Trouble (PROBLEM), the bypass switches
      (SWITCH) and the alarm control panels are deliberately absent: their
      device class already picks the icon, and an override would only fight
      it. The offline validator fails an icon key that names no action or
      entity.
  reconfiguration-flow:
    status: done
    comment: |
      async_step_reconfigure changes the host, port, password, panel model
      and the zone and partition counts, and the entry keeps its entities.
      A blank password keeps the stored one; lowering a count deletes the
      registry entries above it, so no orphan is left unavailable in the
      entity list. There is no unique-id mismatch
      abort because the unique id is the address being changed: the TPI
      protocol exposes no serial or MAC to identify the unit by, so a move
      is a new unique id, and what the flow refuses instead is an address
      another entry already holds. tests/ha/test_config_flow.py covers the
      move, a new password, the wrong password and the recovery from it,
      counts over the model limit, and the taken address.
  repair-issues:
    status: done
    comment: |
      One condition here is both actionable and impossible to read off the
      wire: another TPI client holding the Envisalink's single session, which
      looks exactly like an unreachable host. After five failed reconnects
      (about two and a half minutes) the coordinator raises a warning issue
      naming that cause, and clears it the moment the connection is back or
      the entry is deleted. Nothing else qualifies: a rejected password
      starts reauth, a wrong address is a reconfigure, and a refused command
      is a per-action error, none of which should also be an issue.
  stale-devices:
    status: exempt
    comment: |
      A single device per entry, removed when the entry is. Nothing can go
      stale while the entry lives, since the panel is the entry. The rule
      page lists no exceptions; core files the single-device case this way
      (androidtv_remote: "the integration manages a single device per config
      entry. Stale device removal is handled by removing the config entry").

  # Platinum
  async-dependency:
    status: done
    comment: |
      The client is asyncio streams, in-repo (client.py), free of Home
      Assistant imports. It stays async if lifted into a package.
  inject-websession:
    status: exempt
    comment: |
      The Envisalink speaks a raw TCP protocol on port 4025; there is no
      HTTP session to inject.
  strict-typing:
    status: done
    comment: |
      mypy --strict runs in the Tests workflow with Home Assistant installed
      and no relaxations in pyproject beyond the test package. Green in the
      Tests run for f7ac510 (33940946619, 2026-09-05) and locally on the
      harness venv (Python 3.14.7, Home Assistant 2026.8.3): "Success: no
      issues found in 21 source files".
